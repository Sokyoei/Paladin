# This file is Sokyoei's personal configuration for Python project.

[build-system]
# requires = ["setuptools", "wheel"]
# build-backend = "setuptools.build_meta"
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Paladin"
version = "0.0.1"
authors = [{ name = "Sokyoei" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    # data analysis
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "PyYAML>=6.0.3",
    "loguru>=0.7.3",
    "asgiref>=3.12.1",
    "pydantic-settings>=2.15.0",
]
requires-python = ">= 3.12"

[project.urls]
Repository = "https://github.com/Sokyoei/Paladin"

[project.optional-dependencies]
# Sokyoei know and learn library
utils = ["python-dateutil>=2.9.0.post0", "packaging>=26.3"]
# geography = [
#     "wrf-python", # https://github.com/NCAR/wrf-python
#     "eccodes",    # https://github.com/ecmwf/eccodes-python
#     "ecmwflibs",  # https://github.com/ecmwf/ecmwflibs support to python3.11
#     "f90nml",     # https://github.com/marshallward/f90nml
#     "cdsapi",     # https://github.com/ecmwf/cdsapi
#     "netCDF4",    # https://github.com/Unidata/netcdf4-python
#     "xarray",     # https://github.com/pydata/xarray
#     "cfgrib",     # https://github.com/ecmwf/cfgrib
#     "Cartopy",    # https://github.com/SciTools/cartopy
#     "geopandas",  # https://github.com/geopandas/geopandas
#     "pyshp",      # https://github.com/GeospatialPython/pyshp
#     "pyproj",     # https://github.com/pyproj4/pyproj
# ]
sumo = [
    # https://github.com/eclipse-sumo/sumo
    "eclipse-sumo>=1.27.1",
    "libsumo>=1.27.1",
    "libtraci>=1.19.0",
    "sumolib>=1.27.1",
    "traci>=1.27.1",
]
webapp = ["streamlit>=1.63.0", "gradio>=6.26.0"]
# gui = ["PyQt5"]
cli = ["click>=8.5.0"]
fastapi_learning = [
    "fastapi[all]>=0.141.1",
    "sqlalchemy[aiomysql]>=2.0.52",
    "redis>=8.1.0",
    "fastapi-users[sqlalchemy, oauth]>=15.0.5",
    "sqladmin[full]>=0.31.1",
    "fastapi-cache2>=0.2.2",
    "fastapi-utils[all]>=0.8.0",
    "fastapi-pagination>=0.15.16",
    "prometheus-fastapi-instrumentator>=8.1.0",
]
flask_learning = [
    "Flask[async]>=3.1.3",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.1.0",
    "Flask-Admin[sqlalchemy,images,export,translation]>=2.2.0",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.3.0",
    "Flask-DebugToolbar>=0.16.0",
    "Flask-Limiter>=4.1.1",
    "Flask-Caching>=2.5.1",
]
django_learning = [
    "django>=6.1.1",
    "django-ninja>=1.7.0",
    "djangorestframework>=3.18.1",
    "docutils>=0.23",
    "django-ninja-extra>=0.31.7",
    "django-filter>=26.1",
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
]

[project.scripts]

[project.gui-scripts]

[dependency-groups]
build = ["build>=1.6.0", "hatch>=1.18.0"]
dev = ["isort>=9.0.1", "ruff>=0.16.6", "black>=26.5.1", "pipdeptree>=4.2.3", "viztracer>=1.1.1"]
test = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "tox>=4.61.2", "coverage>=7.16.0"]

[tool.setuptools]
include-package-data = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
ignore-vcs = true
packages = ["python", "paladin"]
include = []
exclude = [".vscode"]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["python", "paladin"]
include = []
exclude = []

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
default-groups = ["dev", "test"]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.isort]
line_length = 120
multi_line_output = 0

[tool.autopep8]
max_line_length = 120

[tool.black]
line-length = 120
preview = true
skip-string-normalization = true
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
extend-exclude = ["typings"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "UP",  # pyupgrade
    "F",   # pyflakes
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "C90", # mccabe
    "I",   # isort
    # "N",   # pep8-naming
    # "D",   # pydocstyle
    "PD",   # pandas-vet
    "NPY",  # numpy specific rules
    "RUF",  # ruff specific rules
    "FAST", # FastAPI
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # https://docs.astral.sh/ruff/rules/line-too-long/
    "RUF001", # https://docs.astral.sh/ruff/rules/ambiguous-unicode-character-string/
    "RUF002", # https://docs.astral.sh/ruff/rules/ambiguous-unicode-character-docstring/
    "RUF003", # https://docs.astral.sh/ruff/rules/ambiguous-unicode-character-comment/
]
# ignore-init-module-imports = true # deprecated https://docs.astral.sh/ruff/settings/#lint_ignore-init-module-imports
pydocstyle = { convention = "google" }

[tool.ruff.lint.isort]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
ignore = ["typings"]
typeCheckingMode = "basic"

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all,jupytext"
